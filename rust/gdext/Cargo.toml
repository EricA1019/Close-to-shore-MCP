[package]
name = "gdext"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "gdext"

[dependencies]
godot = { version = "0.3", features = ["api-4-2"] }
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex-lite = "0.1"
